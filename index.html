                const showOther = currentValue === 'other';
                html += `
                    <div id="treatmentOtherField" style="margin-top: 15px; ${showOther ? '' : 'display: none;'}">
                        <input type="text" class="input-field" id="treatmentOtherInput"
                               placeholder="Please specify"
                               value="${currentOther}"
                               onkeypress="if(event.key==='Enter') nextFromTreatmentDropdown('${node.next}')">
                    </div>
                    <div class="button-group">
                        <button class="btn" onclick="nextFromTreatmentDropdown('${node.next}')">Continue</button>
                        <button class="btn btn-secondary" onclick="backToSummary()">← Back to Summary</button>
                    </div>
                `;
            }

            html += '</div>';
            questionContainer.innerHTML = html;
        }

        function goBackTreatment() {
            const nodeIds = Object.keys(treatmentResponses);
            if (nodeIds.length === 0) {
                // If no responses, go back to summary
                backToSummary();
                return;
            }

            const lastNodeId = nodeIds[nodeIds.length - 1];
            delete treatmentResponses[lastNodeId];
            treatmentCurrentNodeId = lastNodeId;
            renderTreatmentQuestion();
        }

        function goBackFromSummary() {
            const nodeIds = Object.keys(responses);
            if (nodeIds.length === 0) {
                // If no responses, go back to patient name
                document.getElementById('patientNameSection').style.display = 'block';
                document.getElementById('mainCard').style.display = 'none';
                return;
            }

            const lastNodeId = nodeIds[nodeIds.length - 1];
            delete responses[lastNodeId];
            currentNodeId = lastNodeId;

            document.getElementById('summaryContainer').classList.remove('active');
            document.getElementById('questionContainer').style.display = 'block';
            renderQuestion();
        }

        function selectTreatmentChoice(value, hasTextField) {
            const node = config.treatmentNodes.find(n => n.id === treatmentCurrentNodeId);

            if (hasTextField) {
                treatmentResponses[treatmentCurrentNodeId] = { value: value, text: '' };
                renderTreatmentQuestion();
            } else {
                treatmentResponses[treatmentCurrentNodeId] = value;
                treatmentCurrentNodeId = node.next;
                renderTreatmentQuestion();
            }
        }

        function toggleTreatmentMultiple(value) {
            if (!treatmentResponses[treatmentCurrentNodeId]) {
                treatmentResponses[treatmentCurrentNodeId] = [];
            }
            const index = treatmentResponses[treatmentCurrentNodeId].indexOf(value);
            if (index > -1) {
                treatmentResponses[treatmentCurrentNodeId].splice(index, 1);
            } else {
                treatmentResponses[treatmentCurrentNodeId].push(value);
            }
            renderTreatmentQuestion();
        }

        function nextTreatmentQuestion(next) {
            const currentResponse = treatmentResponses[treatmentCurrentNodeId];
            const textInput = document.getElementById('treatmentTextInput');

            if (textInput && typeof currentResponse === 'object') {
                treatmentResponses[treatmentCurrentNodeId].text = textInput.value.trim();
            }

            treatmentCurrentNodeId = next;
            renderTreatmentQuestion();
        }

        function nextFromTreatmentText(next) {
            const input = document.getElementById('treatmentTextInputMain');
            if (input && input.value.trim()) {
                treatmentResponses[treatmentCurrentNodeId] = input.value.trim();
            }
            treatmentCurrentNodeId = next;
            renderTreatmentQuestion();
        }

        function handleTreatmentDropdown() {
            const dropdown = document.getElementById('treatmentDropdown');
            const otherField = document.getElementById('treatmentOtherField');

            if (dropdown.value === 'other') {
                otherField.style.display = 'block';
                document.getElementById('treatmentOtherInput').focus();
            } else {
                otherField.style.display = 'none';
            }
        }

        function nextFromTreatmentDropdown(next) {
            const dropdown = document.getElementById('treatmentDropdown');
            const otherInput = document.getElementById('treatmentOtherInput');

            if (dropdown && dropdown.value) {
                treatmentResponses[treatmentCurrentNodeId] = {
                    value: dropdown.value,
                    other: dropdown.value === 'other' && otherInput ? otherInput.value.trim() : ''
                };
            }
            treatmentCurrentNodeId = next;
            renderTreatmentQuestion();
        }

        function showTreatmentSummary() {
            let summaryHtml = '<h2 style="margin-bottom: 20px;">Complete Patient Documentation</h2>';

            // Add Clinical Summary from initial assessment
            summaryHtml += '<div class="narrative-summary">';
            summaryHtml += '<h3>Clinical Summary</h3>';
            summaryHtml += '<div class="narrative-text">';
            summaryHtml += generateNarrativeSummary().replace('<h3>Clinical Summary</h3><div class="narrative-text">', '').replace('</div>', '');
            summaryHtml += '</div></div>';

            // Add Recommended Treatment Plan
            summaryHtml += '<div class="treatment-plan" style="margin-top: 20px;">';
            summaryHtml += generateTreatmentPlan().replace('<h3>Recommended Treatment Plan</h3>', '<h3>Recommended Treatment Plan</h3>');
            summaryHtml += '</div>';

            // Objective Findings Section
            summaryHtml += '<div class="narrative-summary">';
            summaryHtml += '<h3>Objective Findings</h3>';
            summaryHtml += '<div class="narrative-text">';

            // ROM
            if (treatmentResponses.rom_assessment) {
                const romLabels = { 'normal': 'Normal', 'reduced': 'Reduced', 'severely_limited': 'Severely Limited' };
                summaryHtml += `Range of motion assessment reveals ${romLabels[treatmentResponses.rom_assessment] || treatmentResponses.rom_assessment} mobility in affected regions. `;
            }

            // Subluxation
            if (treatmentResponses.subluxation) {
                summaryHtml += `${treatmentResponses.subluxation}. `;
            }

            // Spinal Levels
            if (treatmentResponses.spinal_levels && Array.isArray(treatmentResponses.spinal_levels)) {
                const levelNode = config.treatmentNodes.find(n => n.id === 'spinal_levels');
                const levels = treatmentResponses.spinal_levels.map(val => {
                    const option = levelNode.options.find(o => o.value === val);
                    return option ? option.label : val;
                }).join(', ');
                summaryHtml += `Specific spinal levels affected include: ${levels}. `;
            }

            // Palpation
            if (treatmentResponses.palpation_findings) {
                summaryHtml += `Palpation findings: ${treatmentResponses.palpation_findings}. `;
            }

            // Orthopedic tests
            if (treatmentResponses.orthopedic_tests) {
                summaryHtml += `Orthopedic/neurological examination: ${treatmentResponses.orthopedic_tests}. `;
            }

            summaryHtml += '</div></div>';

            // Treatment Performed Section
            summaryHtml += '<div class="treatment-plan" style="margin-top: 20px;">';
            summaryHtml += '<h3>Treatment Performed Today</h3>';
            summaryHtml += '<div class="plan-text">';

            // Regions treated
            if (treatmentResponses.regions_treated && Array.isArray(treatmentResponses.regions_treated)) {
                const regionsNode = config.treatmentNodes.find(n => n.id === 'regions_treated');
                const regions = treatmentResponses.regions_treated.map(val => {
                    const option = regionsNode.options.find(o => o.value === val);
                    return option ? option.label : val;
                }).join(', ');
                summaryHtml += `Spinal manipulation performed to the following regions: ${regions}. `;
            }

            // Technique
            if (treatmentResponses.technique_used) {
                let technique = '';
                if (typeof treatmentResponses.technique_used === 'object' && treatmentResponses.technique_used.value) {
                    if (treatmentResponses.technique_used.value === 'other' && treatmentResponses.technique_used.text) {
                        technique = treatmentResponses.technique_used.text;
                    } else {
                        const techNode = config.treatmentNodes.find(n => n.id === 'technique_used');
                        const option = techNode.options.find(o => o.value === treatmentResponses.technique_used.value);
                        technique = option ? option.label : treatmentResponses.technique_used.value;
                    }
                } else {
                    const techNode = config.treatmentNodes.find(n => n.id === 'technique_used');
                    const option = techNode.options.find(o => o.value === treatmentResponses.technique_used);
                    technique = option ? option.label : treatmentResponses.technique_used;
                }
                summaryHtml += `Technique utilized: ${technique}. `;
            }

            // Timed services
            let timedServices = [];
            if (treatmentResponses.therapeutic_exercise) {
                timedServices.push(`Therapeutic Exercise (97110): ${treatmentResponses.therapeutic_exercise} minutes`);
            }
            if (treatmentResponses.manual_therapy) {
                timedServices.push(`Manual Therapy (97140): ${treatmentResponses.manual_therapy} minutes`);
            }
            if (treatmentResponses.neuromuscular_reed) {
                timedServices.push(`Neuromuscular Re-education (97112): ${treatmentResponses.neuromuscular_reed} minutes`);
            }

            if (timedServices.length > 0) {
                summaryHtml += `Additional timed services provided: ${timedServices.join('; ')}. `;
            }

            summaryHtml += '</div></div>';

            // Assessment/Diagnosis
            summaryHtml += '<div class="billing-codes" style="margin-top: 20px;">';
            summaryHtml += '<h3>Assessment & Diagnosis</h3>';

            if (treatmentResponses.icd10_code) {
                let diagnosis = '';
                if (typeof treatmentResponses.icd10_code === 'object' && treatmentResponses.icd10_code.value) {
                    if (treatmentResponses.icd10_code.value === 'other' && treatmentResponses.icd10_code.other) {
                        diagnosis = treatmentResponses.icd10_code.other;
                    } else {
                        const icdNode = config.treatmentNodes.find(n => n.id === 'icd10_code');
                        const option = icdNode.options.find(o => o.value === treatmentResponses.icd10_code.value);
                        diagnosis = option ? option.label : treatmentResponses.icd10_code.value;
                    }
                } else {
                    diagnosis = treatmentResponses.icd10_code;
                }
                summaryHtml += `<div class="code-item"><strong>Primary Diagnosis:</strong> ${diagnosis}</div>`;
            }

            summaryHtml += '</div>';

            // CPT Codes based on regions treated
            summaryHtml += '<div class="billing-codes" style="margin-top: 20px;">';
            summaryHtml += '<h3>Suggested CPT Codes</h3>';

            if (treatmentResponses.regions_treated && Array.isArray(treatmentResponses.regions_treated)) {
                const regionCount = treatmentResponses.regions_treated.length;
                if (regionCount === 1 || regionCount === 2) {
                    summaryHtml += '<div class="code-item">98940 - Chiropractic Manipulative Treatment (CMT), spinal, 1-2 regions</div>';
                } else if (regionCount === 3 || regionCount === 4) {
                    summaryHtml += '<div class="code-item">98941 - Chiropractic Manipulative Treatment (CMT), spinal, 3-4 regions</div>';
                } else if (regionCount >= 5) {
                    summaryHtml += '<div class="code-item">98942 - Chiropractic Manipulative Treatment (CMT), spinal, 5 regions</div>';
                }
            }

            if (treatmentResponses.therapeutic_exercise) {
                summaryHtml += '<div class="code-item">97110 - Therapeutic Exercise</div>';
            }
            if (treatmentResponses.manual_therapy) {
                summaryHtml += '<div class="code-item">97140 - Manual Therapy</div>';
            }
            if (treatmentResponses.neuromuscular_reed) {
                summaryHtml += '<div class="code-item">97112 - Neuromuscular Re-education</div>';
            }

            summaryHtml += '</div>';

            // Organized detailed responses grouped by category
            summaryHtml += '<div style="margin-top: 40px; border-top: 2px solid #d4cfc4; padding-top: 30px;">';
            summaryHtml += '<h2 style="color: #2F5D50; margin-bottom: 20px;">Detailed Documentation Reference</h2>';

            // Assessment Responses Group
            summaryHtml += '<div style="background: white; border: 2px solid #2F5D50; border-radius: 8px; padding: 20px; margin-bottom: 20px;">';
            summaryHtml += '<h3 style="color: #2F5D50; margin-bottom: 15px; font-size: 18px;">Initial Assessment Details</h3>';
            summaryHtml += '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px;">';

            // Add initial assessment responses in organized cards
            const assessmentFields = ['visit_type', 'injury_type', 'work_injury_details', 'accident_details', 'pain_location', 'pain_level', 'aggravating_factors', 'relieving_factors', 'treatment_response', 'current_treatment_frequency', 'insurance_info'];

            assessmentFields.forEach(fieldId => {
                const node = config.nodes.find(n => n.id === fieldId);
                if (node && responses[fieldId]) {
                    let responseText = responses[fieldId];

                    if (node.type === 'single_choice') {
                        if (typeof responses[fieldId] === 'object' && responses[fieldId].value) {
                            const option = node.options.find(o => o.value === responses[fieldId].value);
                            responseText = option ? option.label : responses[fieldId].value;
                            if (responses[fieldId].text) {
                                responseText += ': ' + responses[fieldId].text;
                            }
                        } else {
                            const option = node.options.find(o => o.value === responses[fieldId]);
                            responseText = option ? option.label : responses[fieldId];
                        }
                    } else if (node.type === 'multiple_choice' && Array.isArray(responses[fieldId])) {
                        const items = responses[fieldId].map(val => {
                            const option = node.options.find(o => o.value === val);
                            return option ? option.label : val;
                        });
                        responseText = '<ul style="margin: 5px 0 0 20px; padding: 0;">' + items.map(item => `<li>${item}</li>`).join('') + '</ul>';
                    } else if (node.type === 'dropdown' && typeof responses[fieldId] === 'object') {
                        const option = node.options.find(o => o.value === responses[fieldId].value);
                        if (responses[fieldId].value === 'other' && responses[fieldId].other) {
                            responseText = responses[fieldId].other;
                        } else {
                            responseText = option ? option.label : responses[fieldId].value;
                        }
                    } else if (node.type === 'date_text' && typeof responses[fieldId] === 'object') {
                        const parts = [];
                        if (responses[fieldId].date) parts.push(`<strong>Date:</strong> ${responses[fieldId].date}`);
                        if (responses[fieldId].text) parts.push(responses[fieldId].text);
                        responseText = parts.join('<br>');
                    }

                    summaryHtml += `
                        <div style="background: #FAF6EE; padding: 12px; border-radius: 6px; border-left: 3px solid #2F5D50;">
                            <div style="font-weight: 600; color: #2F5D50; font-size: 13px; margin-bottom: 5px;">${node.question}</div>
                            <div style="color: #000000; font-size: 14px;">${responseText}</div>
                        </div>
                    `;
                }
            });

            summaryHtml += '</div></div>';

            // Treatment Documentation Responses Group
            summaryHtml += '<div style="background: #fff8f3; border: 2px solid #D97652; border-radius: 8px; padding: 20px; margin-bottom: 20px;">';
            summaryHtml += '<h3 style="color: #D97652; margin-bottom: 15px; font-size: 18px;">Treatment Documentation Details</h3>';
            summaryHtml += '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px;">';

            config.treatmentNodes.forEach(node => {
                if (treatmentResponses[node.id]) {
                    let responseText = treatmentResponses[node.id];

                    if (node.type === 'single_choice') {
                        if (typeof treatmentResponses[node.id] === 'object' && treatmentResponses[node.id].value) {
                            const option = node.options.find(o => o.value === treatmentResponses[node.id].value);
                            responseText = option ? option.label : treatmentResponses[node.id].value;
                            if (treatmentResponses[node.id].text) {
                                responseText += ': ' + treatmentResponses[node.id].text;
                            }
                        } else {
                            const option = node.options.find(o => o.value === treatmentResponses[node.id]);
                            responseText = option ? option.label : treatmentResponses[node.id];
                        }
                    } else if (node.type === 'multiple_choice' && Array.isArray(treatmentResponses[node.id])) {
                        const items = treatmentResponses[node.id].map(val => {
                            const option = node.options.find(o => o.value === val);
                            return option ? option.label : val;
                        });
                        responseText = '<ul style="margin: 5px 0 0 20px; padding: 0;">' + items.map(item => `<li>${item}</li>`).join('') + '</ul>';
                    } else if (node.type === 'dropdown' && typeof treatmentResponses[node.id] === 'object') {
                        const option = node.options.find(o => o.value === treatmentResponses[node.id].value);
                        if (treatmentResponses[node.id].value === 'other' && treatmentResponses[node.id].other) {
                            responseText = treatmentResponses[node.id].other;
                        } else {
                            responseText = option ? option.label : treatmentResponses[node.id].value;
                        }
                    }

                    summaryHtml += `
                        <div style="background: white; padding: 12px; border-radius: 6px; border-left: 3px solid #D97652;">
                            <div style="font-weight: 600; color: #D97652; font-size: 13px; margin-bottom: 5px;">${node.question}</div>
                            <div style="color: #000000; font-size: 14px;">${responseText}</div>
                        </div>
                    `;
                }
            });

            summaryHtml += '</div></div>';
            summaryHtml += '</div>';

            document.getElementById('treatmentQuestionContainer').innerHTML = summaryHtml;
        }

        function updateTreatmentButtonText() {
            const button = document.getElementById('treatmentDocButton');
            if (!button) return;

            const totalQuestions = config.treatmentNodes.length;
            const answeredQuestions = Object.keys(treatmentResponses).length;

            if (answeredQuestions === 0) {
                button.textContent = 'Complete Treatment Documentation →';
            } else if (answeredQuestions === totalQuestions) {
                button.textContent = 'View Treatment Documentation →';
            } else {
                button.textContent = `Continue Treatment Documentation (${answeredQuestions}/${totalQuestions}) →`;
            }
        }

        function exportTreatmentDoc(format) {
            const fullDoc = {
                patientName: patientName,
                dateOfService: serviceDate,
                assessment: responses,
                treatment: treatmentResponses,
                timestamp: new Date().toISOString()
            };

            if (format === 'json') {
                const dataStr = JSON.stringify(fullDoc, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                const fileName = patientName ?
                    `${patientName.replace(/\s/g, '_')}-treatment-${Date.now()}.json` :
                    `treatment-doc-${Date.now()}.json`;
                link.download = fileName;
                link.click();
            } else if (format === 'pdf') {
                window.print();
            }
        }

        // Initialize on page load
        init();
    </script>
</body>
</html>
